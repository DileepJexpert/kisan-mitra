name: KisanMitra CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python AI Service Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kisanmitra_test
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd services/ai-service
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests
        env:
          DB_URL: postgresql://admin:testpassword@localhost:5432/kisanmitra_test
          REDIS_HOST: localhost
        run: |
          cd services/ai-service
          python -m pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  java-tests:
    name: Java Gateway Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kisanmitra_test
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Build and test with Maven
        run: |
          cd services/gateway
          mvn clean test -B
        env:
          DB_URL: jdbc:postgresql://localhost:5432/kisanmitra_test
          DB_USERNAME: admin
          DB_PASSWORD: testpassword

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [python-tests, java-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build gateway image
        run: docker build -t kisanmitra-gateway ./services/gateway

      - name: Build AI service image
        run: docker build -t kisanmitra-ai-service ./services/ai-service

      - name: Build scraper image
        run: docker build -t kisanmitra-scraper ./services/scraper
